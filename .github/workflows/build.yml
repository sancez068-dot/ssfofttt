name: Build KM14 Panel APK Only

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build-panel:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build panel APK without native code
        shell: bash
        run: |
          set -euo pipefail
          # Remove leftover native inputs, if this archive is overlaid on an older project.
          find app/src/main -type f \
            \( -name '*.so' -o -name '*.c' -o -name '*.cc' -o -name '*.cpp' -o -name '*.cxx' \) \
            -print -delete
          gradle --no-daemon clean assembleDebug
          APK='app/build/outputs/apk/debug/app-debug.apk'
          test -f "$APK"
          if unzip -Z1 "$APK" | grep -E '\.so$'; then
            echo 'ERROR: APK unexpectedly contains a native .so library.'
            exit 1
          fi

      - name: Upload panel APK
        uses: actions/upload-artifact@v4
        with:
          name: KM14-Panel-APK-Only
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
