name: Build KM14 Native Update

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build-native:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install NDK and CMake
        run: |
          sdkmanager \
            "platform-tools" \
            "ndk;27.2.12479018" \
            "cmake;3.22.1"

      - name: Build ARM64 native library only
        shell: bash
        run: |
          set -euo pipefail
          NDK="$ANDROID_HOME/ndk/27.2.12479018"
          cmake -S app/src/main/cpp -B build-native -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-23 \
            -DANDROID_STL=none \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build-native --target logger --parallel 2

      - name: Package native-only update
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          test -s build-native/liblogger.so
          cp build-native/liblogger.so dist/liblogger.so
          cp README_NATIVE_UPDATE.txt dist/README.txt
          (cd dist && sha256sum liblogger.so > SHA256SUMS)
          (cd dist && zip -9 KM14-Native-Update.zip liblogger.so README.txt SHA256SUMS)
          ls -lh dist/KM14-Native-Update.zip dist/liblogger.so

      - name: Upload native-only artifact
        uses: actions/upload-artifact@v4
        with:
          name: KM14-Native-Update
          path: dist/KM14-Native-Update.zip
          if-no-files-found: error
          retention-days: 30
