plugins {
    id 'com.android.application'
}

android {
    namespace 'com.xcode.km14panel'
    compileSdk 35

    defaultConfig {
        applicationId 'com.xcode.km14panel'
        minSdk 23
        targetSdk 28
        versionCode 25
        versionName '2.5.0'

    }


    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
    }
}
